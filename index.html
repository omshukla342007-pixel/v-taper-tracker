<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Taper Transformation Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-glow: #0284c7;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #334155;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .day-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .day-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .day-btn.active, .day-btn:hover {
            background: var(--accent);
            color: #000;
            font-weight: bold;
        }

        .content-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .exercise-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }

        .exercise-item:last-child {
            border-bottom: none;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .easter-egg-banner {
            display: none;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="main-title" style="cursor: pointer;" title="Click 5 times for a secret!">💪 V-Taper Blueprint</h1>
        <p style="color: var(--muted-text);">Cult Gym & Basketball Transformation Hub</p>
    </header>

    <!-- Gamification & Stats Bar -->
    <div class="stats-bar">
        <div class="stat-card">
            <div>Current Level 🏆</div>
            <div id="user-level" class="stat-value">Rookie</div>
        </div>
        <div class="stat-card">
            <div>Total XP ⚡</div>
            <div id="user-xp" class="stat-value">0 XP</div>
        </div>
        <div class="stat-card">
            <div>Active Streak 🔥</div>
            <div id="user-streak" class="stat-value">0 Days</div>
        </div>
    </div>

    <!-- Day Selector Tabs -->
    <div class="day-selector">
        <button class="day-btn active" onclick="loadDay('Mon')">Mon (Upper)</button>
        <button class="day-btn" onclick="loadDay('Tue')">Tue (Lower)</button>
        <button class="day-btn" onclick="loadDay('Wed')">Wed (Push)</button>
        <button class="day-btn" onclick="loadDay('Thu')">Thu (Pull)</button>
        <button class="day-btn" onclick="loadDay('Fri')">Fri (Heavy Legs)</button>
        <button class="day-btn" onclick="loadDay('Sat')">Sat (Hoops 🏀)</button>
        <button class="day-btn" onclick="loadDay('Sun')">Sun (Hoops 🏀)</button>
    </div>

    <!-- Dynamic Day Content -->
    <div class="content-card">
        <h2 id="day-title" style="color: var(--accent); margin-top: 0;">Monday: Upper Body</h2>
        <div id="exercise-list"></div>
    </div>

    <!-- Easter Egg Unlock Popup -->
    <div id="secret-banner" class="easter-egg-banner">
        🎉 SECRET UNLOCKED: Golden Beast Mode Activated! (+500 Bonus XP)
    </div>
</div>

<script>
    // App State stored in LocalStorage
    let state = JSON.parse(localStorage.getItem('vTaperState')) || {
        xp: 0,
        streak: 0,
        completed: {}
    };

    let titleClicks = 0;

    const schedule = {
        Mon: ["Incline DB Press (3 sets)", "Lat Pulldown (3 sets)", "Overhead DB Press (3 sets)", "Cable Row (3 sets)", "DB Lateral Raises (3 sets)", "☕ Morning Whey Cold Coffee Swap"],
        Tue: ["Barbell / DB Squats (3 sets)", "Romanian Deadlifts (3 sets)", "Leg Extensions (3 sets)", "Seated Leg Curls (3 sets)", "Plank Hold (3 sets)", "🍎 Pre-Gym Healthy Snack"],
        Wed: ["DB Incline Press (3 sets)", "Cable Lateral Raises (4 sets)", "Pec Deck Flyes (3 sets)", "Tricep Pushdowns (3 sets)", "Overhead Rope Extension (3 sets)", "🍵 Evening Green Tea Swap"],
        Thu: ["Wide-Grip Lat Pulldown (4 sets)", "Seated Cable Row (3 sets)", "Face Pulls (3 sets)", "Incline DB Bicep Curls (3 sets)", "Hammer Curls (3 sets)", "🥛 Post-Gym Whey + Sprouts"],
        Fri: ["Heavy Squats / Leg Press (4 sets)", "Hamstring Curls (3 sets)", "Walking DB Lunges (3 sets)", "Standing Calf Raises (4 sets)", "🍚 Pre-Workout Carb Meal"],
        Sat: ["Basketball Session (7:00-9:00 AM 🏀)", "Court Agility & High Cardio", "🥤 Post-Game Electrolytes + Whey"],
        Sun: ["Basketball Session (7:00-9:00 AM 🏀)", "Active Recovery & Mobility Work", "🥤 Post-Game Whey + Whole Fruit"]
    };

    let currentActiveDay = 'Mon';

    function saveState() {
        localStorage.setItem('vTaperState', JSON.stringify(state));
        updateDashboard();
    }

    function updateDashboard() {
        document.getElementById('user-xp').innerText = state.xp + " XP";
        
        // Calculate Level based on XP
        let level = "Rookie";
        if (state.xp >= 300) level = "V-Taper Novice 📐";
        if (state.xp >= 800) level = "Lat Specialist 🦅";
        if (state.xp >= 1500) level = "Sculpted Athlete 🏋️";
        if (state.xp >= 3000) level = "V-Taper Master 👑";
        document.getElementById('user-level').innerText = level;

        document.getElementById('user-streak').innerText = state.streak + " Days";
    }

    function loadDay(dayKey) {
        currentActiveDay = dayKey;
        
        // Highlight active tab
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.startsWith(dayKey));
        });

        document.getElementById('day-title').innerText = dayKey + " Checklist";
        const container = document.getElementById('exercise-list');
        container.innerHTML = '';

        schedule[dayKey].forEach((item, index) => {
            const itemKey = dayKey + '_' + index;
            const isChecked = state.completed[itemKey] || false;

            const div = document.createElement('div');
            div.className = 'exercise-item';
            div.innerHTML = `
                <label class="checkbox-container">
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${itemKey}')">
                    <span>${item}</span>
                </label>
            `;
            container.appendChild(div);
        });
    }

    function toggleCheck(itemKey) {
        if (!state.completed[itemKey]) {
            state.completed[itemKey] = true;
            state.xp += 20; // Gain 20 XP per completed item
        } else {
            state.completed[itemKey] = false;
            state.xp = Math.max(0, state.xp - 20);
        }
        saveState();
    }

    // Easter Egg: Tap title 5 times quickly
    document.getElementById('main-title').addEventListener('click', () => {
        titleClicks++;
        if (titleClicks === 5) {
            document.getElementById('secret-banner').style.display = 'block';
            state.xp += 500;
            saveState();
            setTimeout(() => {
                document.getElementById('secret-banner').style.display = 'none';
            }, 4000);
            titleClicks = 0;
        }
    });

    // Initial Load
    updateDashboard();
    loadDay('Mon');
</script>
</body>
</html>
