<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-TAPER 365 | Cyber-Athlete Suite</title>
  <!-- Chart.js for Body Metric Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0b10;
      --panel-bg: #121520;
      --panel-border: #1e2538;
      --cyan-glow: #00f0ff;
      --magenta-glow: #ff0055;
      --gold-accent: #ffcc00;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --success: #00ff88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    /* Header & Stats Bar */
    header {
      grid-column: 1 / -1;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: var(--cyan-glow);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
    }

    .stat-badge span {
      color: var(--cyan-glow);
    }

    /* Day Navigation Tabs */
    .day-nav {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .day-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .day-btn:hover {
      border-color: var(--cyan-glow);
      color: var(--text-main);
    }

    .day-btn.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 85, 0.2));
      border-color: var(--cyan-glow);
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
    }

    /* Main Main Workout Section */
    .workout-area {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .workout-header {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
    }

    .phase-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
    }

    .phase-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: var(--gold-accent);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .exercise-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .exercise-item:hover {
      border-color: rgba(0, 240, 255, 0.3);
    }

    .ex-info h4 {
      font-size: 1.05rem;
      color: #fff;
    }

    .ex-info p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .check-btn {
      background: transparent;
      border: 2px solid var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-weight: 900;
      transition: all 0.2s;
    }

    .check-btn.completed {
      background: var(--success);
      border-color: var(--success);
      color: #000;
    }

    /* Side Dashboard Widgets */
    .widgets-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .widget-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
    }

    .widget-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: var(--cyan-glow);
      margin-bottom: 15px;
    }

    /* Rest Timer */
    .timer-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      text-align: center;
      color: var(--cyan-glow);
      margin: 10px 0;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .timer-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .timer-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .timer-btn:hover {
      background: var(--cyan-glow);
      color: #000;
    }

    /* Body Metrics Logger */
    .metric-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--panel-border);
      padding: 10px;
      border-radius: 6px;
      color: #fff;
      margin-bottom: 10px;
    }

    .submit-btn {
      width: 100%;
      background: var(--magenta-glow);
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* Mobile Responsive */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Bar -->
    <header>
      <h1>V-Taper 365 ⚡</h1>
      <div class="stats-bar">
        <div class="stat-badge">LEVEL: <span id="user-level">1</span></div>
        <div class="stat-badge">XP: <span id="user-xp">0</span>/100</div>
      </div>
    </header>

    <!-- Day Navigation -->
    <nav class="day-nav" id="day-nav-container"></nav>

    <!-- Main Workout Phase Area -->
    <main class="workout-area">
      <div class="workout-header">
        <h2 id="current-day-title" style="font-family: 'Orbitron', sans-serif;">Select a Day</h2>
      </div>
      <div id="phases-container"></div>
    </main>

    <!-- Sidebar Widgets -->
    <aside class="widgets-sidebar">
      
      <!-- Rest Timer -->
      <div class="widget-box">
        <div class="widget-title">⏱️ Cyber Rest Timer</div>
        <div class="timer-display" id="timer-display">01:00</div>
        <div class="timer-controls">
          <button class="timer-btn" onclick="startTimer(30)">30s</button>
          <button class="timer-btn" onclick="startTimer(60)">60s</button>
          <button class="timer-btn" onclick="startTimer(90)">90s</button>
          <button class="timer-btn" onclick="addTime(15)">+15s</button>
          <button class="timer-btn" onclick="toggleTimer()" id="pause-btn">Pause</button>
          <button class="timer-btn" onclick="resetTimer()">Reset</button>
        </div>
      </div>

      <!-- Metric Tracker -->
      <div class="widget-box">
        <div class="widget-title">📊 Weight Tracker</div>
        <input type="number" id="weight-input" class="metric-input" placeholder="Enter Weight (kg)" step="0.1">
        <button class="submit-btn" onclick="logWeight()">LOG METRIC</button>
        <div style="margin-top: 15px; height: 180px;">

  </div>

        phases: [
          {

            items: [

      },
      Day6: {
        title: "Day 6: Arms, Shoulders & Cardio Finisher 🎯",
        phases: [
          {
            name: "🔥 Warm-Up (5 Mins)",
            items: [
              { name: "Light Shoulder Rotations & Arm Flaps", info: "3 Mins" }
            ]
          },
          {

            items: [
              { name: "1A. Dumbbell Lateral Raises 🦅", info: "3 sets x 15 reps" },
              { name: "1B. Dumbbell Front Raises 🏋️‍♂️", info: "3 sets x 12 reps" },
              { name: "1C. Dumbbell Upright Rows 🚣", info: "3 sets x 12 reps" }
            ]

            ]

              { name: "3B. Burpees (Optionally holding light DBs) ⚡", info: "4 rounds x 30s work / 15s rest" }
            ]
          },
          {
            name: "🧊 Cool-Down (3 Mins)",
            items: [

        ]
      },
      Day7: {
        title: "Day 7: Active Recovery & Mobility Reset 🧘‍♂️",
        phases: [
          {
            name: "🍃 Active Recovery Protocol",
            items: [
              { name: "30–45 Minute Outdoor Walk 🚶‍♂️", info: "Steady, comfortable pace" },
              { name: "Full-Body Mobility Routine 🧘", info: "Cat-Cow, Child's Pose, World's Greatest Stretch" },
              { name: "Light Foam Rolling / Self-Massage 🪵", info: "Calves, Quads, Lats, and Upper Back" }
            ]
          }
        ]
      }
    };

    // State Variables
    let currentDay = 'Day1';
    let xp = 0;
    let level = 1;
    let timerInterval = null;
    let timerTimeLeft = 60;
    let isTimerRunning = false;

    // Render Navigation Buttons
    function initNav() {
      const container = document.getElementById('day-nav-container');
      container.innerHTML = '';
      Object.keys(workoutPlan).forEach((dayKey, idx) => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${dayKey === currentDay ? 'active' : ''}`;
        btn.textContent = `Day ${idx + 1}`;
        btn.onclick = () => selectDay(dayKey);
        container.appendChild(btn);
      });
    }

    // Switch Selected Day
    function selectDay(dayKey) {
      currentDay = dayKey;
      initNav();
      renderWorkout();
    }

    // Render Workout Phases & Exercises
    function renderWorkout() {
      const data = workoutPlan[currentDay];
      document.getElementById('current-day-title').textContent = data.title;
      const container = document.getElementById('phases-container');
      container.innerHTML = '';

      data.phases.forEach((phase) => {
        const phaseDiv = document.createElement('div');
        phaseDiv.className = 'phase-card';

        let itemsHtml = phase.items.map(item => `
          <div class="exercise-item">
            <div class="ex-info">
              <h4>${item.name}</h4>
              <p>${item.info}</p>
            </div>
            <button class="check-btn" onclick="toggleComplete(this)">✓</button>
          </div>
        `).join('');

        phaseDiv.innerHTML = `
          <div class="phase-title">${phase.name}</div>
          ${itemsHtml}
        `;
        container.appendChild(phaseDiv);
      });
    }

    // Complete Exercise & Gain XP
    function toggleComplete(btn) {
      btn.classList.toggle('completed');
      if (btn.classList.contains('completed')) {
        addXP(10);
      } else {
        addXP(-10);
      }
    }

    // XP & Level Progression Engine
    function addXP(amount) {
      xp += amount;
      if (xp < 0) xp = 0;
      if (xp >= 100) {
        level += Math.floor(xp / 100);
        xp = xp % 100;
      }
      document.getElementById('user-xp').textContent = xp;
      document.getElementById('user-level').textContent = level;
    }

    // Rest Timer Logic
    function updateTimerDisplay() {
      const mins = Math.floor(timerTimeLeft / 60).toString().padStart(2, '0');
      const secs = (timerTimeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').textContent = `${mins}:${secs}`;
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerTimeLeft = seconds;
      isTimerRunning = true;
      updateTimerDisplay();
      document.getElementById('pause-btn').textContent = "Pause";
      
      timerInterval = setInterval(() => {
        if (timerTimeLeft > 0) {
          timerTimeLeft--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          isTimerRunning = false;
          alert("⏱️ Rest Time Over! Next Set!");
        }
      }, 1000);
    }

    function toggleTimer() {
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById('pause-btn').textContent = "Resume";
      } else if (timerTimeLeft > 0) {
        isTimerRunning = true;
        document.getElementById('pause-btn').textContent = "Pause";
        timerInterval = setInterval(() => {
          if (timerTimeLeft > 0) {
            timerTimeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
          }
        }, 1000);
      }
    }

    function addTime(secs) {
      timerTimeLeft += secs;
      updateTimerDisplay();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerTimeLeft = 60;
      updateTimerDisplay();
      document.getElementById('pause-btn').textContent = "Pause";
    }

    // Chart.js Metrics Engine
    let weightChart;
    function initChart() {
      const ctx = document.getElementById('weightChart').getContext('2d');
      weightChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['W1', 'W2', 'W3'],
          datasets: [{
            label: 'Weight (kg)',
            data: [75.0, 74.5, 74.2],
            borderColor: '#00f0ff',
            backgroundColor: 'rgba(0, 240, 255, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
          }
        }
      });
    }

    function logWeight() {
      const input = document.getElementById('weight-input');
      const val = parseFloat(input.value);
      if (val) {
        const nextWeek = `W${weightChart.data.labels.length + 1}`;
        weightChart.data.labels.push(nextWeek);
        weightChart.data.datasets[0].data.push(val);
        weightChart.update();
        input.value = '';
        addXP(25); // XP reward for logging weight
      }
    }

    // Initialize App
    window.onload = () => {
      initNav();
      renderWorkout();
      initChart();
    };
  </script>
</body>
</html>
