<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ V-TAPER SYSTEM 365 // CYBER-ATHLETE SUITE</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"V-Taper System 365","short_name":"V-Taper","start_url":".","display":"standalone","background_color":"#060913","theme_color":"#00f2fe","icons":[{"src":"https://img.icons8.com/neon/192/000000/dumbbell.png","sizes":"192x192","type":"image/png"}]}'>
    <meta name="theme-color" content="#00f2fe">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-color: #040711;
            --panel-bg: rgba(13, 20, 36, 0.88);
            --border-color: #1a2744;
            --neon-blue: #00f2fe;
            --neon-purple: #9d4edd;
            --neon-pink: #ff007f;
            --neon-red: #ff2a5f;
            --neon-green: #00ffaa;
            --neon-gold: #ffb703;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; transition: all 0.25s ease; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(157, 78, 221, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0; padding: 15px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .container { max-width: 960px; width: 100%; }

        header { text-align: center; padding: 15px 0; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .hero-title { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--neon-blue); margin: 0; }
        .btn-reset { background: rgba(255, 42, 95, 0.2); border: 1px solid var(--neon-red); color: var(--neon-red); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron', sans-serif;}

        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }

        .stat-val { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--neon-blue); }

        .timer-display { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; color: var(--neon-gold); text-align: center; margin: 10px 0; }
        .btn-timer { background: var(--neon-blue); color: #000; font-family: 'Orbitron', sans-serif; font-weight: 700; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin: 2px; }

        .nav-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; }
        .nav-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .nav-btn.active { border-color: var(--neon-blue); color: var(--neon-blue); background: rgba(0, 242, 254, 0.1); }

        .exercise-item { background: rgba(10, 16, 28, 0.6); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .ex-title { font-weight: 700; font-size: 1rem; color: var(--text-main); }
        .ex-info { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

        input[type="number"], select { background: #000; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 6px; border-radius: 6px; font-family: 'Orbitron', sans-serif; width: 80px; text-align: center; }
        canvas { max-height: 200px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-top">
            <div style="width: 80px;"></div>
            <h1 class="hero-title">⚡ V-TAPER 365 ⚡</h1>
            <button class="btn-reset" onclick="resetProgress()">🔄 RESET</button>
        </div>
    </header>

    <!-- Timer & Tracker Panel -->
    <div class="grid-2">
        <!-- Rest Timer -->
        <div class="card">
            <h3 style="margin:0; font-family:'Orbitron'; color:var(--neon-gold);">⏱️ SUPERSET REST TIMER</h3>
            <div id="timer" class="timer-display">00:45</div>
            <div style="text-align:center;">
                <button class="btn-timer" onclick="startTimer(30)">30 SEC</button>
                <button class="btn-timer" onclick="startTimer(45)">45 SEC</button>
                <button class="btn-timer" style="background:var(--neon-red); color:#fff;" onclick="stopTimer()">STOP</button>
            </div>
        </div>

        <!-- Body Fat & Weight Tracker -->
        <div class="card">
            <h3 style="margin:0; font-family:'Orbitron'; color:var(--neon-green);">📈 BODY FAT & WEIGHT LOG</h3>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                <div>
                    <label style="font-size:0.85rem;">Weight (kg):</label>
                    <input type="number" id="input-weight" value="78" onchange="logMetrics()">
                </div>
                <div>
                    <label style="font-size:0.85rem;">Body Fat (%):</label>
                    <input type="number" id="input-bf" value="18" onchange="logMetrics()">
                </div>
            </div>
            <div style="margin-top:10px; font-size:0.9rem;">
                Target: <strong style="color:var(--neon-green);">< 13% Body Fat</strong>
            </div>
        </div>
    </div>

    <!-- Analytics Chart -->
    <div class="card">
        <h3 style="margin:0 0 10px 0; font-family:'Orbitron'; color:var(--neon-blue);">📊 BODY FAT TREND LINE</h3>
        <canvas id="bfChart"></canvas>
    </div>

    <!-- Day Selector -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="loadDay('Mon')">Mon (Arms/Tri)</button>
        <button class="nav-btn" onclick="loadDay('Tue')">Tue (Biceps/Chest)</button>
        <button class="nav-btn" onclick="loadDay('Wed')">Wed (Forearm/Abs)</button>
        <button class="nav-btn" onclick="loadDay('Thu')">Thu (Arms/Tri)</button>
        <button class="nav-btn" onclick="loadDay('Fri')">Fri (Biceps/Chest)</button>
        <button class="nav-btn" onclick="loadDay('Sat')">Sat (Forearm/Chest)</button>
        <button class="nav-btn" onclick="loadDay('Sun')">Sun (Abs/Legs)</button>
    </div>

    <!-- Workout Protocol Checklist -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:15px;">
            <h2 id="day-title" style="margin:0; font-family:'Orbitron'; color:var(--neon-blue);">Monday Protocol</h2>
            <div>
                <label style="font-size:0.85rem; font-weight:700;">Effort Rating (RPE 1-10):</label>
                <input type="number" id="rpe-input" min="1" max="10" value="8" onchange="saveRPE()">
            </div>
        </div>
        <div id="exercise-list"></div>
    </div>
</div>

<script>
    const defaultState = {
        weight: 78,
        bf: 18,
        completed: {},
        loggedDays: [],
        bfHistory: [20, 19.5, 19, 18.5, 18],
        rpeLogs: {}
    };

    let state = JSON.parse(localStorage.getItem('vTaper365_v4')) || defaultState;
    let timerInterval = null;
    let chartInstance = null;

    const workoutPlan = {
        Mon: {
            title: "Monday: Arms + Triceps (High-Intensity Supersets)",
            items: [
                { name: "SUPERSET 1: Machine Tricep Extension + Diamond Push-ups", info: "3 Sets x 10-12 reps each. Minimal rest between exercises." },
                { name: "SUPERSET 2: Close-Grip Push-ups + Dips", info: "3 Sets x 10 reps to failure." },
                { name: "SUPERSET 3: Pike Push-ups + Planch Hold / Power Push-ups", info: "3 Sets x 8-10 reps + 30s hold." },
                { name: "FINISHER: 3-Min Dumbbell Arm Complex", info: "Non-stop DB Hex Press, DB Tricep Extensions, and DB Kickbacks." }
            ]
        },
        Tue: {
            title: "Tuesday: Biceps + Chest (Hybrid Power)",
            items: [
                { name: "SUPERSET 1: Machine Chest Press + Clap Push-ups", info: "3 Sets x 10 reps." },
                { name: "SUPERSET 2: Incline DB Press + DB Bicep Curls", info: "3 Sets x 10-12 reps." },
                { name: "SUPERSET 3: Bodyweight Dips + Diamond Push-ups", info: "3 Sets to muscle burnout." },
                { name: "FINISHER: 3-Min DB Chest Flye & Bicep Curl Burnout", info: "Light DBs, maximum reps until failure." }
            ]
        },
        Wed: {
            title: "Wednesday: Forearms + Abs (Core Conditioning)",
            items: [
                { name: "SUPERSET 1: Wrist Gripper Work + Dragon Fly / Leg Lifts", info: "4 Sets x 15 reps." },
                { name: "SUPERSET 2: Windshield Wipers + Russian Twists", info: "3 Sets x 15-20 reps." },
                { name: "CIRCUIT: Burpees + L-Sit Hold", info: "3 Rounds x 15 Burpees + 30s L-Sit." }
            ]
        },
        Thu: {
            title: "Thursday: Arms + Triceps (Density Focus)",
            items: [
                { name: "SUPERSET 1: Machine Seated Rows + DB Lateral Raises", info: "3 Sets x 12 reps (Joint balance & shoulder width)." },
                { name: "SUPERSET 2: DB Overhead Tricep Extension + One-Arm Push-ups", info: "3 Sets x 8-10 reps." },
                { name: "FINISHER: High Plank & Shoulder Taps Circuit", info: "3 Rounds x 45s work / 15s rest." }
            ]
        },
        Fri: {
            title: "Friday: Biceps + Chest (Hypertrophy)",
            items: [
                { name: "SUPERSET 1: Machine Chest Flyes + Flying Incline Push-ups", info: "3 Sets x 10 reps." },
                { name: "SUPERSET 2: DB Hammer Curls + Reverse Push-ups", info: "3 Sets x 12 reps." },
                { name: "FINISHER: 3-Min DB Renegade Row & Push-up Complex", info: "Non-stop alternating DB rows and push-ups." }
            ]
        },
        Sat: {
            title: "Saturday: Forearm + Chest (Chest Density)",
            items: [
                { name: "SUPERSET 1: Heavy DB Bench Press + Archer Push-ups", info: "3 Sets x 8-10 reps." },
                { name: "SUPERSET 2: Gripper Hold + Wide-Arm Push-ups", info: "3 Sets x Max reps." },
                { name: "CARDIO CIRCUIT: Side-to-Side Shuffle + Stepping Sprawls", info: "4 Rounds x 30s each." }
            ]
        },
        Sun: {
            title: "Sunday: Abs + Legs (Lower Body Conditioning)",
            items: [
                { name: "SUPERSET 1: Leg Press / DB Squats + Pistol Squats", info: "3 Sets x 10 reps per leg." },
                { name: "SUPERSET 2: Machine Leg Extensions + Jump Squats", info: "3 Sets x 12 reps." },
                { name: "FINISHER: Calf Raises + Wall Sit Hold", info: "3 Sets x 20 Calf Raises + 1-Min Wall Sit." }
            ]
        }
    };

    let activeDay = 'Mon';

    function saveState() {
        localStorage.setItem('vTaper365_v4', JSON.stringify(state));
    }

    function resetProgress() {
        if (confirm("Reset all tracked data back to default?")) {
            localStorage.removeItem('vTaper365_v4');
            location.reload();
        }
    }

    function startTimer(seconds) {
        stopTimer();
        let timeLeft = seconds;
        updateTimerDisplay(timeLeft);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay(timeLeft);
            if (timeLeft <= 0) {
                stopTimer();
                alert("⏰ Rest interval over! Time for your next superset.");
            }
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
    }

    function updateTimerDisplay(s) {
        const mins = Math.floor(s / 60);
        const secs = s % 60;
        document.getElementById('timer').innerText = 
            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function logMetrics() {
        state.weight = parseFloat(document.getElementById('input-weight').value) || 78;
        const newBf = parseFloat(document.getElementById('input-bf').value) || 18;
        state.bf = newBf;
        state.bfHistory.push(newBf);
        if (state.bfHistory.length > 7) state.bfHistory.shift();
        saveState();
        updateChart();
    }

    function initChart() {
        const ctx = document.getElementById('bfChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Log 1', 'Log 2', 'Log 3', 'Log 4', 'Log 5', 'Log 6', 'Current'],
                datasets: [{
                    label: 'Body Fat %',
                    data: state.bfHistory,
                    borderColor: '#00ffaa',
                    backgroundColor: 'rgba(0, 255, 170, 0.1)',
                    borderWidth: 2,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#64748b' } },
                    y: { ticks: { color: '#64748b' } }
                }
            }
        });
    }

    function updateChart() {
        if (chartInstance) {
            chartInstance.data.datasets[0].data = state.bfHistory;
            chartInstance.update();
        }
    }

    function loadDay(dayKey) {
        activeDay = dayKey;
        document.querySelectorAll('.nav-btn').forEach(b => {
            b.classList.toggle('active', b.innerText.startsWith(dayKey));
        });

        const data = workoutPlan[dayKey];
        document.getElementById('day-title').innerText = data.title;
        document.getElementById('rpe-input').value = state.rpeLogs[dayKey] || 8;

        const container = document.getElementById('exercise-list');
        container.innerHTML = '';

        data.items.forEach((item, idx) => {
            const key = `${dayKey}_${idx}`;
            const checked = state.completed[key] || false;
            const div = document.createElement('div');
            div.className = 'exercise-item';
            div.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleCheck('${key}')" style="width:20px; height:20px;">
                    <span class="ex-title">${item.name}</span>
                </div>
                <div class="ex-info">💡 ${item.info}</div>
            `;
            container.appendChild(div);
        });
    }

    function toggleCheck(key) {
        state.completed[key] = !state.completed[key];
        saveState();
    }

    function saveRPE() {
        const val = document.getElementById('rpe-input').value;
        state.rpeLogs[activeDay] = val;
        saveState();
    }

    window.onload = () => {
        document.getElementById('input-weight').value = state.weight;
        document.getElementById('input-bf').value = state.bf;
        initChart();
        loadDay('Mon');
    };
</script>
</body>
</html>
