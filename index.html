<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
    }

    .day-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      justify-content: center;
    }

    .day-btn {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .day-btn:hover {
      background-color: var(--border);
    }

    .day-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .workout-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .workout-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .workout-header h2 {
      font-size: 1.5rem;
      color: #ffffff;
    }

    .workout-header .meta {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin: 20px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .exercise-list {
      list-style: none;
    }

    .superset-block {
      background-color: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .superset-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .exercise-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercise-item:last-child {
      border-bottom: none;
    }

    .exercise-name {
      font-weight: 600;
    }

    .exercise-details {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .rest-note {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 8px;
      font-style: italic;
    }

    .stretches-list, .warmup-list {
      list-style: disc;
      padding-left: 20px;
      color: var(--text-muted);
    }

    .warmup-list li, .stretches-list li {
      margin-bottom: 6px;
    }
  </style>
</head>

  function showDay(dayNumber) {
    // Update button states
    const buttons = document.querySelectorAll('.day-btn');
    buttons.forEach((btn, index) => {
      if (index + 1 === dayNumber) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    const data = workoutData[dayNumber];
    const container = document.getElementById('workoutContent');

    let supersetsHTML = '';
    data.supersets.forEach(ss => {
      let exercisesHTML = '';
      ss.exercises.forEach(ex => {
        exercisesHTML += `
          <li class="exercise-item">
            <span class="exercise-name">${ex.name}</span>
            <span class="exercise-details">${ex.details}</span>
          </li>
        `;
      });

      supersetsHTML += `
        <div class="superset-block">
          <div class="superset-title">${ss.title}</div>
          <ul class="exercise-list">
            ${exercisesHTML}
          </ul>
          <div class="rest-note">${ss.rest}</div>
        </div>
      `;
    });

    let warmupHTML = data.warmup.map(item => `<li>${item}</li>`).join('');
    let cooldownHTML = data.cooldown.map(item => `<li>${item}</li>`).join('');

    container.innerHTML = `
      <div class="workout-header">
        <h2>${data.title}</h2>
        <div class="meta">${data.meta}</div>
      </div>

      <div class="section-title">Warm-Up & Mobility (5–8 Mins) 🧘</div>
      <ul class="warmup-list">

      <div class="section-title">Cool-Down Stretches (5 Mins) 🧘‍♂️</div>
      <ul class="stretches-list">
        ${cooldownHTML}
      </ul>
    `;
